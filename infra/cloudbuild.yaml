# CI/CD: connect this repo to Cloud Build with a trigger on push to main.
steps:
  - name: 'node:22'
    entrypoint: bash
    args: ['-c', 'npm ci && npm run typecheck && npm test && npm run build']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ringback-app:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/ringback-app:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/ringback-app']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ringback-app
      - --image=gcr.io/$PROJECT_ID/ringback-app:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
images:
  - 'gcr.io/$PROJECT_ID/ringback-app:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
